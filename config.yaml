seed: 20240501

paths:
  raw: data/raw
  processed: data/processed
  tables: reports/tables
  figures: reports/figures

data:
  source: CASdatasets (dutangc/CASdatasets, master branch)
  urls:
    freMTPL2freq: https://raw.githubusercontent.com/dutangc/CASdatasets/master/data/freMTPL2freq.rda
    freMTPL2sev: https://raw.githubusercontent.com/dutangc/CASdatasets/master/data/freMTPL2sev.rda
  description_url: https://raw.githubusercontent.com/dutangc/CASdatasets/master/DESCRIPTION
  # Historical releases of the two files in the CASdatasets git history, compared by
  # src/data/versions.py (not part of `make all`; needs network access to GitHub).
  history:
    raw_base: https://raw.githubusercontent.com/dutangc/CASdatasets
    releases:
      - {commit: c49cbbb37235fc49616cac8ccac32e1491cdc619, date: 2017-01-19, dir: data, description: "add dataset files"}
      - {commit: 9aa07b9d7f07c6d877674decc95503bf1f0fd8c5, date: 2017-01-21, dir: pkg/data, description: "resave data file 7"}
      - {commit: 4511e99ee6c30ce60ec78e7ebe41f366f4f46975, date: 2020-11-16, dir: pkg/data, description: "new data files"}
      - {commit: 531aa236fc344c1d16bfb26e6fd453299aa2cea5, date: 2022-06-23, dir: pkg/data, description: "update to remove inconsistencies"}
      - {commit: 8a37c3c34990260d5ac374e3b0e0271b2f076413, date: 2024-09-17, dir: data, description: "bug fix in Region"}

shap:
  # Stage 4 subsample size = min(sample_size_max, runtime_budget_seconds / expected cost per row),
  # with the cost per row scaled from reports/tables/shap_runtime_benchmark.csv by the tuned
  # model's tree count (TreeSHAP interaction cost is linear in rows and in trees).
  sample_size_max: 20000
  runtime_budget_seconds: 900

cleaning:
  exposure_cap: 1.0          # policy-years; see DECISIONS D008
  claim_count_cap: 4         # frequency model only; see DECISIONS D009
  # Large-loss threshold for the attritional severity model; see DECISIONS D010.
  large_loss_threshold: 20000
  large_loss_candidates: [5000, 10000, 20000, 30000, 50000, 100000, 200000]

split:
  # Rows sharing all rating covariates form one group (possible same-risk splits);
  # groups are assigned whole to the holdout or to one CV fold. See DECISIONS D011.
  group_covariates: [Area, VehPower, VehAge, DrivAge, BonusMalus, VehBrand, VehGas, Density, Region]
  holdout_share: 0.2
  n_folds: 5
