seed: 20240501

paths:
  raw: data/raw
  processed: data/processed
  tables: reports/tables
  figures: reports/figures

data:
  source: CASdatasets (dutangc/CASdatasets, master branch)
  urls:
    freMTPL2freq: https://raw.githubusercontent.com/dutangc/CASdatasets/master/data/freMTPL2freq.rda
    freMTPL2sev: https://raw.githubusercontent.com/dutangc/CASdatasets/master/data/freMTPL2sev.rda
  description_url: https://raw.githubusercontent.com/dutangc/CASdatasets/master/DESCRIPTION
  documentation_url: https://raw.githubusercontent.com/dutangc/CASdatasets/master/man/freMTPL.Rd
  # Historical releases of the two files in the CASdatasets git history, compared by
  # src/data/versions.py (not part of `make all`; needs network access to GitHub).
  history:
    raw_base: https://raw.githubusercontent.com/dutangc/CASdatasets
    releases:
      - {commit: c49cbbb37235fc49616cac8ccac32e1491cdc619, date: 2017-01-19, dir: data, description: "add dataset files"}
      - {commit: 9aa07b9d7f07c6d877674decc95503bf1f0fd8c5, date: 2017-01-21, dir: pkg/data, description: "resave data file 7"}
      - {commit: 4511e99ee6c30ce60ec78e7ebe41f366f4f46975, date: 2020-11-16, dir: pkg/data, description: "new data files"}
      - {commit: 531aa236fc344c1d16bfb26e6fd453299aa2cea5, date: 2022-06-23, dir: pkg/data, description: "update to remove inconsistencies"}
      - {commit: 8a37c3c34990260d5ac374e3b0e0271b2f076413, date: 2024-09-17, dir: data, description: "bug fix in Region"}

shap:
  # Stage 4 subsample size = min(sample_size_max, runtime_budget_seconds / expected cost per row),
  # with the cost per row scaled from reports/tables/shap_runtime_benchmark.csv by the tuned
  # model's tree count (TreeSHAP interaction cost is linear in rows and in trees).
  sample_size_max: 20000
  runtime_budget_seconds: 900
  top_pairs: 8                 # pairs taken forward to dependence plots / A/E heatmaps
  h_stat_sample: 1000          # rows for Friedman's H cross-check (cost grows with the square)

cleaning:
  exposure_cap: 1.0          # policy-years; see DECISIONS D008
  claim_count_cap: 4         # frequency model only; see DECISIONS D009
  # Large-loss threshold for the attritional severity model; see DECISIONS D010.
  large_loss_threshold: 20000
  large_loss_candidates: [5000, 10000, 20000, 30000, 50000, 100000, 200000]
  sensitivity_thresholds: [10000, 20000, 50000]   # LIMITATIONS sensitivity table

split:
  # Rows sharing all rating covariates form one group (possible same-risk splits);
  # groups are assigned whole to the holdout or to one CV fold. See DECISIONS D011.
  group_covariates: [Area, VehPower, VehAge, DrivAge, BonusMalus, VehBrand, VehGas, Density, Region]
  holdout_share: 0.2
  n_folds: 5

banding:
  min_band_exposure: 2000    # learn-set policy-years per level of every rating factor; see DECISIONS D013
  # Left-closed integer edges: [a, b). The last edge is open-ended.
  edges:
    DrivAge: [18, 21, 23, 25, 27, 30, 35, 45, 55, 65, 75]
    VehAge: [0, 1, 2, 5, 8, 11, 14, 17, 20]
    VehPower: [4, 5, 6, 7, 8, 9, 10, 11, 12]
    BonusMalus: [50, 51, 56, 61, 66, 71, 76, 81, 91, 100, 111]
    LogDensity: [0, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5]
  # Geographic grouping of sparse regions (old French regions; neighbours merged)
  region_groups:
    Alsace: Nord-Est small (Als, Ch-Ard, F-Comte)
    Champagne-Ardenne: Nord-Est small (Als, Ch-Ard, F-Comte)
    Franche-Comte: Nord-Est small (Als, Ch-Ard, F-Comte)
    Corse: PACA + Corse
    Provence-Alpes-Cotes-D'Azur: PACA + Corse
    Auvergne: Auvergne + Limousin
    Limousin: Auvergne + Limousin
  # VehBrand labels carry no information, so a sparse brand joins the brand with the
  # nearest learn-set one-way frequency (computed, not hard-coded)
  spline_df:
    DrivAge: [4, 6, 8]
    BonusMalus: [3, 5, 7]

glm:
  factors: [DrivAge_band, VehAge_band, VehPower_band, BonusMalus_band, LogDensity_band, VehBrand_grp, Region_grp, VehGas]
  tol: 1.0e-10
  max_iter: 50

gbm:
  features: [DrivAge, VehAge, VehPower, BonusMalus, LogDensity, VehGas, VehBrand, Region]
  rank_encoded: [VehBrand, Region]   # frequency-rank encoding fitted on training rows only (D006)
  monotone_increasing: [BonusMalus]  # see DECISIONS D020
  max_rounds: 5000
  early_stopping_rounds: 100
  n_trials: 24                       # random draws (without replacement) from the 324-point grid below
  grid:
    learning_rate: [0.03, 0.05, 0.1]
    num_leaves: [15, 31, 63]
    min_data_in_leaf: [200, 500, 1000, 2000]
    feature_fraction: [0.6, 0.8, 1.0]
    lambda_l2: [0.0, 1.0, 10.0]

impact:
  change_bands: [-1.0, -0.20, -0.10, -0.05, 0.05, 0.10, 0.20, 10.0]
  cap: 0.15                       # illustrative +/-15% cap / collar on year-one movement
  segment_min_exposure: 1000      # policy-years for a two-factor segment to count as material
  top_segments: 10
